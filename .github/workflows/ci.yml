name: ci

on:
  push:
    branches: [main]
  pull_request:

# The JavaScript SDK is self-contained. The Python SDK depends on kuno-protocol from the
# subnet repo, so its tests run in the development workspace until that package is published.
jobs:
  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm test
