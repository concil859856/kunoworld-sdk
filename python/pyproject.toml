[project]
name = "kunoworld"
version = "0.1.0"
description = "KunoWorld Python SDK: private video generation with end-to-end encryption to attested GPU enclaves"
requires-python = ">=3.10"
dependencies = [
    # [tdx]: clients check TDX quotes against Intel's root themselves (kuno_protocol.endorsements).
    "kuno-protocol[tdx]",
    "httpx>=0.27",
]

[project.optional-dependencies]
# kunoworld-mcp, the local MCP server for AI agents (kunoworld.mcp). FastMCP as the 1.x SDK ships it: mcp 2 renamed it
# and moved to another HTTP client.
mcp = ["mcp>=1.26,<2"]

[project.scripts]
kunoworld-mcp = "kunoworld.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kunoworld"]
